<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wirehair WASM Test</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            #output {
                background-color: #f0f0f0;
                border: 1px solid #ccc;
                padding: 10px;
                white-space: pre-wrap;
                word-wrap: break-word;
                max-height: 500px;
                overflow-y: auto;
            }
        </style>
    </head>
    <body>
        <h1>Wirehair WebAssembly Example</h1>
        <p>
            Check the browser's developer console for detailed logs. Output will
            also be mirrored below:
        </p>
        <pre id="output"></pre>

        <!-- 
        This script will be generated by Emscripten. 
        It defines `createWirehairModule` which returns a Promise that resolves with the Module object.
        -->
        <script src="wirehair.js"></script>
        <script type="module">
            import { runJsReadmeExample } from "./readme_example.js";
            const outputElement = document.getElementById("output");
            console._log = console.log;
            console._error = console.error;
            console.log = function (...args) {
                console._log(...args);
                outputElement.textContent += args.join(" ") + "\n";
            };
            console.error = function (...args) {
                console._error(...args);
                outputElement.textContent += "ERROR: " + args.join(" ") + "\n";
            };
            async function run() {
                const wirehair = await createWirehairModule();
                console.log("Wirehair module loaded successfully.");
                try {
                    // Run the example from the README
                    await runJsReadmeExample(wirehair);
                    console.log("Example completed successfully.");
                } catch (error) {
                    console.error("Error running example:", error);
                }
            }
            run();
        </script>
    </body>
</html>
